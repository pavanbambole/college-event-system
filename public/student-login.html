<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login – CampusConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="/index.html">
        <div class="brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
        <span>Campus<span class="text-primary">Connect</span></span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <a href="/index.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back to Home</a>
      </div>
    </div>
  </nav>

  <!-- Login Form Container -->
  <main class="d-flex align-items-center justify-content-center py-5 flex-grow-1">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <div class="card custom-card p-4 p-md-5 border-0 shadow-lg">
            <div class="text-center mb-4">
              <div class="brand-icon mx-auto mb-2"><i class="bi bi-person-fill fs-4"></i></div>
              <h3 class="fw-bold">Student Portal Login</h3>
              <p class="text-muted small">Sign in to manage registrations, access passes, and discover events.</p>
            </div>

            <form id="studentLoginForm">
              <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
                  <input type="email" id="loginEmail" class="form-control" placeholder="student@campusconnect.edu" required>
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label fw-semibold d-flex justify-content-between">
                  <span>Password</span>
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
                  <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('loginPassword', this)">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <button type="submit" id="loginSubmitBtn" class="btn btn-primary-custom w-100 py-2 mb-3">
                Sign In as Student
              </button>

              <div class="text-center small text-muted">
                Don't have an account yet? <a href="/student-register.html" class="fw-bold text-primary">Register Here</a>
              </div>
              <div class="text-center small text-muted mt-2">
                Are you an administrator? <a href="/admin-login.html" class="text-secondary fw-semibold">Admin Login</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      auth.redirectIfAuthenticated();

      document.getElementById('studentLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('loginSubmitBtn');
        btn.disabled = true;
        btn.innerText = 'Verifying...';

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        try {
          const res = await api.auth.loginStudent({ email, password });
          auth.saveSession(res.token, res.user);
          showToast('Login successful! Redirecting...', 'success');
          
          const urlParams = new URLSearchParams(window.location.search);
          const redirectUrl = urlParams.get('redirect') || '/student-dashboard.html';
          setTimeout(() => {
            window.location.href = redirectUrl;
          }, 800);
        } catch (error) {
          showToast(error.message || 'Invalid email or password', 'error');
          btn.disabled = false;
          btn.innerText = 'Sign In as Student';
        }
      });
    });

    function togglePasswordVisibility(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i class="bi bi-eye-slash"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i class="bi bi-eye"></i>';
      }
    }
  </script>
</body>
</html>
