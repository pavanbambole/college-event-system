<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile – CampusConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="/index.html">
        <div class="brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
        <span>Campus<span class="text-primary">Connect</span> <small class="badge bg-primary-subtle text-primary fs-7 ms-2">Student Portal</small></span>
      </a>
      <div class="d-flex align-items-center gap-3 ms-auto" id="navAuthSection"></div>
    </div>
  </nav>

  <!-- Layout -->
  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="p-3 bg-light rounded-3 mb-3 text-center border">
        <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center mx-auto mb-2 fw-bold" style="width: 48px; height: 48px;">
          <i class="bi bi-person-fill fs-4"></i>
        </div>
        <h6 class="fw-bold mb-0" id="studentDisplayName">Student Name</h6>
        <small class="text-muted" id="studentDisplayRoll">Roll Number</small>
      </div>

      <div class="sidebar-heading">Main Navigation</div>
      <a href="/student-dashboard.html" class="sidebar-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="/student-events.html" class="sidebar-link"><i class="bi bi-compass"></i> Discover Events</a>
      <a href="/my-registrations.html" class="sidebar-link"><i class="bi bi-ticket-perforated"></i> My Registrations</a>
      <a href="/event-history.html" class="sidebar-link"><i class="bi bi-clock-history"></i> Event History</a>
      <a href="/feedback.html" class="sidebar-link"><i class="bi bi-star"></i> Feedback & Reviews</a>

      <div class="sidebar-heading">Account</div>
      <a href="/student-profile.html" class="sidebar-link active"><i class="bi bi-person-gear"></i> My Profile</a>
      <a href="/settings.html" class="sidebar-link"><i class="bi bi-gear"></i> Settings</a>
      <a href="javascript:void(0)" onclick="auth.logout()" class="sidebar-link text-danger mt-auto"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="container-fluid" style="max-width: 900px;">
        <h3 class="fw-bold mb-4">My Student Profile</h3>

        <div class="card custom-card p-4 p-md-5 mb-4">
          <form id="profileForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Full Name</label>
                <input type="text" id="profFullName" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" id="profEmail" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Student ID / Roll Number</label>
                <input type="text" id="profStudentId" class="form-control" disabled readonly>
                <small class="text-muted">Roll number is fixed to your college academic record.</small>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Mobile Number</label>
                <input type="tel" id="profMobile" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Department</label>
                <input type="text" id="profDepartment" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Course</label>
                <input type="text" id="profCourse" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Year</label>
                <input type="text" id="profYear" class="form-control" required>
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Bio / Personal Interests</label>
                <textarea id="profBio" class="form-control" rows="3"></textarea>
              </div>
              <div class="col-12 mt-4 text-end">
                <button type="submit" id="saveProfileBtn" class="btn btn-primary-custom px-4">
                  <i class="bi bi-check2-circle me-1"></i> Save Changes
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/student.js"></script>
</body>
</html>
