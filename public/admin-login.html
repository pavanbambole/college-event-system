<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrator Login – CampusConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card p-4 p-md-5 border-0 shadow-lg rounded-4">
          <div class="text-center mb-4">
            <div class="stat-icon-box bg-danger text-white mx-auto mb-3 shadow">
              <i class="bi bi-shield-lock-fill fs-3"></i>
            </div>
            <h3 class="fw-bold">Administrator Portal</h3>
            <p class="text-muted small">Authorized Access for Dean of Student Affairs & Event Committees</p>
          </div>

          <form id="adminLoginForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Admin Email</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" id="adminEmail" class="form-control" placeholder="admin@campusconnect.edu" required>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" id="adminPassword" class="form-control" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" id="adminLoginBtn" class="btn btn-danger w-100 py-2 fw-semibold mb-3 shadow-sm">
              <i class="bi bi-shield-check me-2"></i>Authenticate Admin
            </button>

            <div class="text-center small text-muted">
              <a href="/index.html" class="text-decoration-none text-muted"><i class="bi bi-arrow-left me-1"></i> Return to Campus Homepage</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      auth.redirectIfAuthenticated();

      document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('adminLoginBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...';

        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value;

        try {
          const res = await api.auth.loginAdmin({ email, password });
          auth.saveSession(res.token, res.user);
          showToast('Admin verification successful!', 'success');
          setTimeout(() => {
            window.location.href = '/admin-dashboard.html';
          }, 800);
        } catch (error) {
          showToast(error.message || 'Invalid administrator credentials', 'error');
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-shield-check me-2"></i>Authenticate Admin';
        }
      });
    });
  </script>
</body>
</html>
