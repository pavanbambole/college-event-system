<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details – CampusConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="/index.html">
        <div class="brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
        <span>Campus<span class="text-primary">Connect</span></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav me-auto ms-lg-4 mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="/events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="/about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact.html">Contact</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2" id="navAuthSection"></div>
      </div>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="py-5 bg-light flex-grow-1" id="eventDetailsMain">
    <div class="container" id="eventDetailsContainer">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Loading event details...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container text-center small text-muted">
      &copy; 2026 CampusConnect – Smart College Event Management System (TAE-I Project).
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script>
    let currentEvent = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const eventId = urlParams.get('id');

      if (!eventId) {
        window.location.href = '/events.html';
        return;
      }

      try {
        const res = await api.events.getById(eventId);
        currentEvent = res.data;
        renderEventDetails(currentEvent);
      } catch (err) {
        document.getElementById('eventDetailsContainer').innerHTML = `
          <div class="alert alert-danger text-center p-5">
            <h4>Event Not Found</h4>
            <p>The requested event could not be found or has been removed.</p>
            <a href="/events.html" class="btn btn-primary">Back to All Events</a>
          </div>
        `;
      }
    });

    function renderEventDetails(evt) {
      const container = document.getElementById('eventDetailsContainer');
      const capacityPercent = evt.maxCapacity > 0
        ? Math.min(100, Math.round(((evt.currentRegistrations || 0) / evt.maxCapacity) * 100))
        : 0;

      container.innerHTML = `
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/index.html">Home</a></li>
            <li class="breadcrumb-item"><a href="/events.html">Events</a></li>
            <li class="breadcrumb-item active" aria-current="page">${evt.eventName}</li>
          </ol>
        </nav>

        <div class="row g-4">
          <!-- Left Main Column -->
          <div class="col-lg-8">
            <div class="card custom-card overflow-hidden mb-4">
              <img src="${evt.eventImage || 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=800&q=80'}" class="img-fluid w-100" style="max-height: 400px; object-fit: cover;" alt="${evt.eventName}">
              <div class="card-body p-4 p-md-5">
                <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
                  ${getCategoryBadge(evt.category)}
                  ${getStatusBadge(evt.eventStatus)}
                  <span class="badge bg-light text-dark border"><i class="bi bi-building me-1"></i>${evt.department || 'All Departments'}</span>
                </div>
                
                <h1 class="fw-bold mb-3">${evt.eventName}</h1>
                <p class="text-muted lead mb-4">${evt.description}</p>

                <!-- Rules & Guidelines -->
                <div class="mb-4">
                  <h5 class="fw-bold"><i class="bi bi-shield-check text-primary me-2"></i>Rules & Guidelines</h5>
                  <div class="p-3 bg-light rounded-3 border">
                    <pre class="mb-0 text-dark" style="font-family: inherit; white-space: pre-wrap;">${evt.rules || 'Standard college code of conduct applies.'}</pre>
                  </div>
                </div>

                <!-- Eligibility -->
                <div class="mb-4">
                  <h5 class="fw-bold"><i class="bi bi-patch-question text-info me-2"></i>Eligibility Criteria</h5>
                  <p class="text-muted">${evt.eligibility || 'Open to all students with valid College ID.'}</p>
                </div>

                <!-- Reviews Section -->
                <div class="mt-5 pt-4 border-top">
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">Student Reviews (${evt.feedbackCount || 0})</h5>
                    <div class="d-flex align-items-center gap-1">
                      ${renderStars(evt.averageRating)}
                      <span class="fw-bold ms-1">${evt.averageRating} / 5</span>
                    </div>
                  </div>

                  <div id="reviewsList">
                    ${(!evt.feedback || evt.feedback.length === 0) 
                      ? '<p class="text-muted small">No reviews submitted yet for this event.</p>'
                      : evt.feedback.map(f => `
                        <div class="card bg-light border-0 p-3 mb-2 rounded-3">
                          <div class="d-flex justify-content-between align-items-center mb-1">
                            <strong>${f.studentName}</strong>
                            <div>${renderStars(f.rating)}</div>
                          </div>
                          <p class="small text-muted mb-1">"${f.comments}"</p>
                          <small class="text-muted" style="font-size: 0.75rem;">${formatDate(f.submittedAt)}</small>
                        </div>
                      `).join('')
                    }
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Right Sidebar Details & Register Box -->
          <div class="col-lg-4">
            <div class="card custom-card sticky-top p-4" style="top: 90px;">
              <h5 class="fw-bold mb-3 border-bottom pb-2">Event Quick Info</h5>

              <ul class="list-unstyled d-flex flex-column gap-3 mb-4">
                <li class="d-flex align-items-start gap-3">
                  <i class="bi bi-calendar-event fs-5 text-primary"></i>
                  <div>
                    <small class="text-muted d-block">Date</small>
                    <strong>${formatDate(evt.date)}</strong>
                  </div>
                </li>
                <li class="d-flex align-items-start gap-3">
                  <i class="bi bi-clock fs-5 text-primary"></i>
                  <div>
                    <small class="text-muted d-block">Time</small>
                    <strong>${evt.startTime} - ${evt.endTime}</strong>
                  </div>
                </li>
                <li class="d-flex align-items-start gap-3">
                  <i class="bi bi-geo-alt fs-5 text-danger"></i>
                  <div>
                    <small class="text-muted d-block">Venue</small>
                    <strong>${evt.venue}</strong>
                  </div>
                </li>
                <li class="d-flex align-items-start gap-3">
                  <i class="bi bi-person-badge fs-5 text-info"></i>
                  <div>
                    <small class="text-muted d-block">Organizer</small>
                    <strong>${evt.organizer}</strong>
                  </div>
                </li>
                <li class="d-flex align-items-start gap-3">
                  <i class="bi bi-hourglass-bottom fs-5 text-warning"></i>
                  <div>
                    <small class="text-muted d-block">Registration Deadline</small>
                    <strong>${formatDate(evt.registrationDeadline)}</strong>
                  </div>
                </li>
              </ul>

              <!-- Capacity Tracker -->
              <div class="mb-4">
                <div class="d-flex justify-content-between small fw-bold mb-1">
                  <span>Seats Booked</span>
                  <span>${evt.currentRegistrations || 0} / ${evt.maxCapacity}</span>
                </div>
                <div class="progress progress-thin">
                  <div class="progress-bar ${capacityPercent >= 90 ? 'bg-danger' : 'bg-primary'}" role="progressbar" style="width: ${capacityPercent}%"></div>
                </div>
                <small class="text-muted d-block mt-1">${evt.maxCapacity - (evt.currentRegistrations || 0)} spots remaining</small>
              </div>

              <!-- Action Register Button -->
              <div class="d-grid gap-2">
                ${renderRegisterButton(evt)}
              </div>

              <div class="text-center mt-3 small text-muted">
                <i class="bi bi-info-circle me-1"></i> Instant digital pass issued upon registration.
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderRegisterButton(evt) {
      if (evt.eventStatus === 'Cancelled') {
        return `<button class="btn btn-secondary btn-lg" disabled>Event Cancelled</button>`;
      }
      if (evt.eventStatus === 'Completed') {
        return `<button class="btn btn-secondary btn-lg" disabled>Event Completed</button>`;
      }
      if (evt.eventStatus === 'Registration Closed') {
        return `<button class="btn btn-danger btn-lg" disabled>Registration Closed</button>`;
      }

      if (!auth.isLoggedIn()) {
        return `
          <a href="/student-login.html?redirect=${encodeURIComponent(window.location.pathname + window.location.search)}" class="btn btn-primary-custom btn-lg">
            Login to Register
          </a>
        `;
      }

      if (auth.isAdmin()) {
        return `<a href="/edit-event.html?id=${evt.id}" class="btn btn-warning btn-lg fw-bold"><i class="bi bi-pencil me-1"></i> Edit Event (Admin)</a>`;
      }

      // Student Logged in
      return `
        <button class="btn btn-primary-custom btn-lg fw-bold shadow" onclick="triggerEventRegistration('${evt.id}')">
          <i class="bi bi-ticket-perforated-fill me-2"></i> Register for Event
        </button>
      `;
    }

    async function triggerEventRegistration(eventId) {
      if (!confirm('Would you like to register for this event?')) return;
      try {
        const res = await api.registrations.create({ eventId });
        showToast(res.message, 'success');
        setTimeout(() => {
          window.location.href = '/my-registrations.html';
        }, 1200);
      } catch (err) {
        showToast(err.message || 'Registration failed', 'error');
      }
    }
  </script>
</body>
</html>
