<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings – CampusConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="/index.html">
        <div class="brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
        <span>Campus<span class="text-primary">Connect</span> <small class="badge bg-primary-subtle text-primary fs-7 ms-2">Student Portal</small></span>
      </a>
      <div class="d-flex align-items-center gap-3 ms-auto" id="navAuthSection"></div>
    </div>
  </nav>

  <!-- Layout -->
  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="p-3 bg-light rounded-3 mb-3 text-center border">
        <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center mx-auto mb-2 fw-bold" style="width: 48px; height: 48px;">
          <i class="bi bi-person-fill fs-4"></i>
        </div>
        <h6 class="fw-bold mb-0" id="studentDisplayName">Student Name</h6>
        <small class="text-muted" id="studentDisplayRoll">Roll Number</small>
      </div>

      <div class="sidebar-heading">Main Navigation</div>
      <a href="/student-dashboard.html" class="sidebar-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="/student-events.html" class="sidebar-link"><i class="bi bi-compass"></i> Discover Events</a>
      <a href="/my-registrations.html" class="sidebar-link"><i class="bi bi-ticket-perforated"></i> My Registrations</a>
      <a href="/event-history.html" class="sidebar-link"><i class="bi bi-clock-history"></i> Event History</a>
      <a href="/feedback.html" class="sidebar-link"><i class="bi bi-star"></i> Feedback & Reviews</a>

      <div class="sidebar-heading">Account</div>
      <a href="/student-profile.html" class="sidebar-link"><i class="bi bi-person-gear"></i> My Profile</a>
      <a href="/settings.html" class="sidebar-link active"><i class="bi bi-gear"></i> Settings</a>
      <a href="javascript:void(0)" onclick="auth.logout()" class="sidebar-link text-danger mt-auto"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="container-fluid" style="max-width: 800px;">
        <h3 class="fw-bold mb-4">Account Security & Settings</h3>

        <!-- Change Password Card -->
        <div class="card custom-card p-4 p-md-5 mb-4">
          <h5 class="fw-bold mb-3"><i class="bi bi-shield-lock text-primary me-2"></i>Change Password</h5>
          <form id="changePasswordForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Current Password</label>
              <input type="password" id="currPassword" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">New Password (Min. 6 characters)</label>
              <input type="password" id="newPassword" class="form-control" placeholder="••••••••" minlength="6" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Confirm New Password</label>
              <input type="password" id="confirmNewPassword" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="text-end">
              <button type="submit" id="pwdSaveBtn" class="btn btn-primary-custom px-4">Update Password</button>
            </div>
          </form>
        </div>

        <!-- Notification Preferences -->
        <div class="card custom-card p-4">
          <h5 class="fw-bold mb-3"><i class="bi bi-bell text-info me-2"></i>Preferences</h5>
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="prefEmail" checked>
            <label class="form-check-label" for="prefEmail">Email reminders for upcoming registered events (24 hours prior)</label>
          </div>
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="prefAnnouncements" checked>
            <label class="form-check-label" for="prefAnnouncements">Receive notifications about newly announced Hackathons & Fests</label>
          </div>
          <button type="button" class="btn btn-outline-secondary btn-sm" onclick="showToast('Preferences saved.', 'success')">Save Preferences</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/student.js"></script>
  <script>
    function loadStudentSettings() {
      const pwdForm = document.getElementById('changePasswordForm');
      if (pwdForm) {
        pwdForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const curr = document.getElementById('currPassword').value;
          const next = document.getElementById('newPassword').value;
          const conf = document.getElementById('confirmNewPassword').value;

          if (next !== conf) {
            return showToast('New passwords do not match', 'error');
          }
          if (next.length < 6) {
            return showToast('Password must be at least 6 characters', 'warning');
          }

          const btn = document.getElementById('pwdSaveBtn');
          btn.disabled = true;
          btn.innerText = 'Updating...';

          try {
            await api.students.update(currentStudent.id, {
              currentPassword: curr,
              newPassword: next
            });
            showToast('Password updated successfully! Please keep it secure.', 'success');
            pwdForm.reset();
          } catch (err) {
            showToast(err.message || 'Failed to update password', 'error');
          } finally {
            btn.disabled = false;
            btn.innerText = 'Update Password';
          }
        });
      }
    }
  </script>
</body>
</html>
